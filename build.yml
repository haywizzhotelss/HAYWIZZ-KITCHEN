          package com.haywizz.kitchen;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.provider.Settings;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONObject;

          /** Haywizz Kitchen: shows the kitchen web app full screen. Background alerts are done by OrderService. */
          public class MainActivity extends Activity {

              /** The kitchen page on your website. Change this if your website address changes. */
              static final String URL = "https://haywizzmenu.netlify.app/kitchen.html";

              private WebView web;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private SharedPreferences sp;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  sp = getSharedPreferences("hz", MODE_PRIVATE);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);
                  web.addJavascriptInterface(new Bridge(), "HaywizzNative");
                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          Uri u = r.getUrl();
                          String host = Uri.parse(URL).getHost();
                          if (u.getHost() != null && u.getHost().equals(host)) return false;
                          try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { /* ignore */ }
                          return true;
                      }

                      @Override
                      public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError e) {
                          if (r.isForMainFrame()) {
                              v.loadData("<html><body style='background:#121110;color:#f4efe6;font-family:sans-serif;text-align:center;padding-top:30%'>"
                                      + "<h2>No internet</h2><p>Retrying…</p></body></html>", "text/html", "utf-8");
                              handler.postDelayed(() -> web.loadUrl(URL), 5000);
                          }
                      }
                  });
                  web.loadUrl(URL);

                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 1);
                  }
                  // Ask once to be exempt from battery optimisation so Android doesn't stop the alerts.
                  handler.postDelayed(this::askBatteryOnce, 4000);
              }

              private void askBatteryOnce() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (!sp.getBoolean("asked_batt", false) && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          sp.edit().putBoolean("asked_batt", true).apply();
                          startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                                  Uri.parse("package:" + getPackageName())));
                      }
                  } catch (Exception e) { /* ignore */ }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else moveTaskToBack(true);   // keep running in background
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacksAndMessages(null);
                  super.onDestroy();
              }

              /** Functions the kitchen web page can call as window.HaywizzNative.* */
              class Bridge {
                  @JavascriptInterface
                  public boolean isNative() { return true; }

                  @JavascriptInterface
                  public int version() { return 3; }

                  @JavascriptInterface
                  public String savedLogin() {
                      try {
                          JSONObject o = new JSONObject();
                          o.put("email", sp.getString("email", ""));
                          o.put("pass", sp.getString("pass", ""));
                          return o.toString();
                      } catch (Exception e) { return "{}"; }
                  }

                  @JavascriptInterface
                  public boolean serviceRunning() { return OrderService.running; }

                  @JavascriptInterface
                  public void startService(String url, String key, String email, String pass, boolean voice) {
                      sp.edit().putString("url", url).putString("key", key).putString("email", email)
                              .putString("pass", pass).putBoolean("voice", voice).putBoolean("enabled", true).apply();
                      Intent i = new Intent(MainActivity.this, OrderService.class);
                      if (OrderService.running) { i.setAction("RELOGIN"); }
                      MainActivity.this.startForegroundService(i);
                  }

                  @JavascriptInterface
                  public void stopService() {
                      sp.edit().putBoolean("enabled", false).remove("pass").apply();
                      MainActivity.this.stopService(new Intent(MainActivity.this, OrderService.class));
                  }

                  @JavascriptInterface
                  public void setVoice(boolean on) {
                      sp.edit().putBoolean("voice", on).apply();
                      if (on && OrderService.running) {
                          Intent i = new Intent(MainActivity.this, OrderService.class);
                          i.setAction("SAY").putExtra("text", "Voice announcements on");
                          MainActivity.this.startService(i);
                      }
                  }

                  /** "Repeat voice" button: speaks the given pieces (JSON array of text) through the background service. */
                  @JavascriptInterface
                  public void sayOrder(String segsJson) {
                      Intent i = new Intent(MainActivity.this, OrderService.class);
                      i.setAction("SAYSEG").putExtra("segs", segsJson);
                      try { MainActivity.this.startForegroundService(i); } catch (Exception e) { /* ignore */ }
                  }

                  @JavascriptInterface
                  public void printPage() {
                      runOnUiThread(() -> {
                          PrintManager pm = (PrintManager) getSystemService(PRINT_SERVICE);
                          pm.print("Haywizz KOT", web.createPrintDocumentAdapter("KOT"), new PrintAttributes.Builder().build());
                      });
                  }
              }
          }
          HZEOF
          mkdir -p app/src/main/java/com/haywizz/kitchen
          cat > app/src/main/java/com/haywizz/kitchen/OrderService.java <<'HZEOF'
          package com.haywizz.kitchen;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.drawable.Icon;
          import android.media.AudioAttributes;
          import android.app.AlarmManager;
          import android.os.Build;
          import android.os.SystemClock;
          import android.speech.tts.UtteranceProgressListener;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.speech.tts.TextToSpeech;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.util.ArrayList;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Iterator;
          import java.util.Locale;
          import java.util.Set;

          /**
           * Foreground service: checks the database every few seconds for NEW orders, speaks each one aloud
           * (table / room / online customer name + dishes) and shows a notification. Works with the screen off.
           */
          public class OrderService extends Service implements TextToSpeech.OnInitListener {

              static volatile boolean running = false;

              private static final String CH_SVC = "hz_service";
              private static final String CH_ORD = "hz_orders";
              private static final int SVC_ID = 1;
              private static final long POLL_MS = 4000;
              private static final long REPEAT_MS = 20000;

              private SharedPreferences sp;
              private PowerManager.WakeLock wl;
              private TextToSpeech tts;
              private volatile boolean ttsReady = false;
              private final List<List<String>> pendingSpeech = new ArrayList<>();   // requests that came before the voice engine was ready
              private volatile boolean stop = false;
              private Thread loop;
              private NotificationManager nm;

              private String token = null;
              private long tokenExp = 0;
              private String lastStatus = "";
              private final Set<String> announced = new HashSet<>();
              private long lastRound = 0;
              private final java.util.Map<String, Integer> times = new java.util.HashMap<>();   // how many times each order was spoken
              private static final int MAX_TIMES = 2;                                          // each order is spoken 2 times, then stops
              private volatile long lastSpeechEnd = 0;
              private static final long SMALL_GAP = 600, ORDER_GAP = 1800;

              @Override
              public void onCreate() {
                  super.onCreate();
                  sp = getSharedPreferences("hz", MODE_PRIVATE);
                  nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);

                  NotificationChannel svc = new NotificationChannel(CH_SVC, "Kitchen running", NotificationManager.IMPORTANCE_LOW);
                  nm.createNotificationChannel(svc);
                  NotificationChannel ord = new NotificationChannel(CH_ORD, "New orders", NotificationManager.IMPORTANCE_HIGH);
                  ord.setSound(null, null);                       // no beep – the voice announces the order
                  ord.enableVibration(true);
                  ord.setVibrationPattern(new long[]{0, 400, 150, 400, 150, 800});
                  nm.createNotificationChannel(ord);

                  loadTimes();
                  tts = new TextToSpeech(this, this);
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "haywizz:orders");
                  wl.setReferenceCounted(false);
              }

              /** How many times each order was spoken is saved, so if Android restarts the service nothing is announced again. */
              private void loadTimes() {
                  try {
                      JSONObject o = new JSONObject(sp.getString("times", "{}"));
                      Iterator<String> k = o.keys();
                      while (k.hasNext()) { String id = k.next(); times.put(id, o.getInt(id)); announced.add(id); }
                  } catch (Exception e) { /* ignore */ }
              }

              private void saveTimes() {
                  try {
                      JSONObject o = new JSONObject();
                      for (java.util.Map.Entry<String, Integer> e : times.entrySet()) o.put(e.getKey(), e.getValue());
                      sp.edit().putString("times", o.toString()).apply();
                  } catch (Exception e) { /* ignore */ }
              }

              @Override
              public void onInit(int status) {
                  if (status != TextToSpeech.SUCCESS) return;
                  int r = tts.setLanguage(new Locale("en", "IN"));
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) tts.setLanguage(Locale.ENGLISH);
                  tts.setAudioAttributes(new AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH).build());
                  tts.setSpeechRate(0.85f);          // a little slower = clearer
                  tts.setOnUtteranceProgressListener(new UtteranceProgressListener() {
                      @Override public void onStart(String id) { }
                      @Override public void onDone(String id) { lastSpeechEnd = System.currentTimeMillis(); }
                      @Override public void onError(String id) { lastSpeechEnd = System.currentTimeMillis(); }
                  });
                  ttsReady = true;
                  synchronized (pendingSpeech) { for (List<String> l : pendingSpeech) speakSegments(l); pendingSpeech.clear(); }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String action = intent == null ? null : intent.getAction();
                  if ("STOP".equals(action)) {
                      sp.edit().putBoolean("enabled", false).apply();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  Notification n = serviceNotification(lastStatus.isEmpty() ? "Starting…" : lastStatus);
                  if (Build.VERSION.SDK_INT >= 34) startForeground(SVC_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE);
                  else startForeground(SVC_ID, n);
                  running = true;
                  if (!wl.isHeld()) wl.acquire();

                  if ("SAY".equals(action) && intent.getStringExtra("text") != null) speak(intent.getStringExtra("text"));
                  if ("SAYSEG".equals(action) && intent.getStringExtra("segs") != null) {
                      try {
                          JSONArray a = new JSONArray(intent.getStringExtra("segs"));
                          List<String> segs = new ArrayList<>();
                          for (int i = 0; i < a.length(); i++) segs.add(a.getString(i));
                          speakSegments(segs);
                      } catch (Exception e) { /* ignore */ }
                  }
                  if ("RELOGIN".equals(action)) { token = null; tokenExp = 0; }

                  if (loop == null || !loop.isAlive()) {
                      stop = false;
                      loop = new Thread(this::runLoop, "hz-poll");
                      loop.start();
                  }
                  return START_STICKY;
              }

              /** If the app is swiped away from recent apps, start the service again so alerts keep working. */
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  if (sp.getBoolean("enabled", false)) {
                      try {
                          AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                          PendingIntent pi = PendingIntent.getForegroundService(this, 7, new Intent(this, OrderService.class),
                                  PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                          am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 3000, pi);
                      } catch (Exception e) { /* ignore */ }
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }

              @Override
              public void onDestroy() {
                  stop = true;
                  running = false;
                  if (loop != null) loop.interrupt();
                  if (tts != null) { tts.stop(); tts.shutdown(); }
                  if (wl != null && wl.isHeld()) wl.release();
                  super.onDestroy();
              }

              /* ---------------- polling ---------------- */

              private void runLoop() {
                  while (!stop) {
                      try {
                          poll();
                      } catch (InterruptedException ie) {
                          break;
                      } catch (Exception e) {
                          setStatus("No internet – retrying");
                      }
                      try { Thread.sleep(POLL_MS); } catch (InterruptedException e) { break; }
                  }
              }

              private void poll() throws Exception {
                  String url = sp.getString("url", "");
                  String key = sp.getString("key", "");
                  if (url.isEmpty() || key.isEmpty()) { setStatus("Open the app and sign in"); return; }
                  if (token == null || System.currentTimeMillis() > tokenExp) login(url, key);
                  if (token == null) return;

                  String q = url + "/rest/v1/orders?select=id,order_no,source,order_type,location_label,location_kind,table_no,customer_name,items"
                          + "&status=eq.new&order=created_at.asc&limit=50";
                  String[] res = http("GET", q, key, token, null);
                  if ("401".equals(res[0]) || "403".equals(res[0])) { token = null; return; }
                  if (!res[0].startsWith("2")) { setStatus("Server error " + res[0] + " – retrying"); return; }

                  JSONArray arr = new JSONArray(res[1]);          // oldest first from the server
                  boolean voice = sp.getBoolean("voice", true);
                  long now = System.currentTimeMillis();
                  Set<String> current = new HashSet<>();
                  boolean anyNew = false;

                  // brand-new orders: notify + speak, newest first
                  for (int i = arr.length() - 1; i >= 0; i--) {
                      JSONObject o = arr.getJSONObject(i);
                      String id = o.getString("id");
                      current.add(id);
                      if (!announced.contains(id)) {
                          notifyOrder(o);
                          if (voice) speakOrder(o);
                          announced.add(id);
                          times.put(id, 1); saveTimes();
                          anyNew = true;
                      }
                  }
                  if (anyNew) lastRound = now;

                  // Speak each waiting order a 2nd time (once), after a pause. After that it stays silent.
                  // The kitchen can tap "Repeat voice" on an order to hear it again.
                  if (voice && !anyNew && arr.length() > 0 && now - lastSpeechEnd > REPEAT_MS && !(ttsReady && tts.isSpeaking())) {
                      for (int i = arr.length() - 1; i >= 0; i--) {
                          JSONObject o = arr.getJSONObject(i);
                          String id = o.getString("id");
                          Integer n = times.get(id);
                          if (n != null && n < MAX_TIMES) { speakOrder(o); times.put(id, n + 1); saveTimes(); }
                      }
                  }

                  // orders that are no longer "new" (accepted / cancelled): clear their notification
                  Iterator<String> it = announced.iterator();
                  while (it.hasNext()) {
                      String id = it.next();
                      if (!current.contains(id)) { nm.cancel(id.hashCode()); it.remove(); times.remove(id); saveTimes(); }
                  }
                  setStatus(arr.length() == 0 ? "Listening for new orders" : arr.length() + " new order(s) waiting");
              }

              private void login(String url, String key) throws Exception {
                  String email = sp.getString("email", ""), pass = sp.getString("pass", "");
                  if (email.isEmpty() || pass.isEmpty()) { setStatus("Open the app and sign in"); return; }
                  JSONObject body = new JSONObject().put("email", email).put("password", pass);
                  String[] res = http("POST", url + "/auth/v1/token?grant_type=password", key, null, body.toString());
                  if (!res[0].startsWith("2")) {
                      token = null;
                      setStatus("Login failed – open the app and sign in again");
                      return;
                  }
                  JSONObject j = new JSONObject(res[1]);
                  token = j.getString("access_token");
                  long exp = j.optLong("expires_in", 3600);
                  tokenExp = System.currentTimeMillis() + Math.max(60, exp - 120) * 1000L;
              }

              /** returns {statusCode, body} */
              private String[] http(String method, String urlStr, String key, String bearer, String body) throws Exception {
                  HttpURLConnection c = (HttpURLConnection) new java.net.URL(urlStr).openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(10000);
                  c.setReadTimeout(15000);
                  c.setRequestProperty("apikey", key);
                  if (bearer != null) c.setRequestProperty("Authorization", "Bearer " + bearer);
                  c.setRequestProperty("Accept", "application/json");
                  if (body != null) {
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type", "application/json");
                      try (OutputStream os = c.getOutputStream()) { os.write(body.getBytes("UTF-8")); }
                  }
                  int code = c.getResponseCode();
                  InputStream is = code >= 400 ? c.getErrorStream() : c.getInputStream();
                  StringBuilder sb = new StringBuilder();
                  if (is != null) {
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = is.read(buf)) > 0) sb.append(new String(buf, 0, n, "UTF-8"));
                      is.close();
                  }
                  c.disconnect();
                  return new String[]{String.valueOf(code), sb.toString()};
              }

              /* ---------------- voice + notifications ---------------- */

              private static String str(JSONObject o, String k) { return o.isNull(k) ? "" : o.optString(k, ""); }

              private static String say(String s) {
                  return s.replace("&", " and ").replaceAll("[/()]", " ").replaceAll("\\s+", " ").trim();
              }

              private String locLabel(JSONObject o) {
                  String l = str(o, "location_label");
                  if (!l.isEmpty()) return l;
                  String t = str(o, "table_no");
                  return t.isEmpty() ? "Table" : "Table " + t;
              }

              /** Room 101 -> "Room one zero one" so the number is clear. */
              private static String spell(String s) {
                  String[] d = {"zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine"};
                  java.util.regex.Matcher m = java.util.regex.Pattern.compile("\\d{3,}").matcher(say(s));
                  StringBuffer sb = new StringBuffer();
                  while (m.find()) {
                      StringBuilder w = new StringBuilder();
                      for (char c : m.group().toCharArray()) { if (w.length() > 0) w.append(" "); w.append(d[c - '0']); }
                      m.appendReplacement(sb, w.toString());
                  }
                  m.appendTail(sb);
                  return sb.toString();
              }

              /** The order as short pieces: heading, room/table or customer, then one piece per dish. */
              private List<String> segments(JSONObject o) {
                  List<String> l = new ArrayList<>();
                  if ("table".equals(str(o, "source"))) {
                      l.add("room".equals(str(o, "location_kind")) ? "Room order." : "Table order.");
                      l.add(spell(locLabel(o)) + ".");
                  } else {
                      l.add("delivery".equals(str(o, "order_type")) ? "Online delivery order." : "Online take away order.");
                      String name = str(o, "customer_name");
                      if (!name.isEmpty()) l.add("From " + say(name) + ".");
                  }
                  JSONArray arr = o.optJSONArray("items");
                  if (arr != null) {
                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject it = arr.optJSONObject(i);
                          if (it == null) continue;
                          String name = str(it, "n"), label = str(it, "l");
                          l.add(it.optInt("q", 1) + " " + say(name + (label.isEmpty() ? "" : " " + label)) + ".");
                      }
                  }
                  return l;
              }

              private void speakOrder(JSONObject o) { speakSegments(segments(o)); }

              /** Speaks each piece with a small gap after it, and a longer gap after the whole order. */
              private void speakSegments(List<String> segs) {
                  if (!ttsReady) { synchronized (pendingSpeech) { pendingSpeech.add(segs); } return; }
                  for (String s : segs) {
                      tts.speak(s, TextToSpeech.QUEUE_ADD, null, "hz" + System.nanoTime());
                      tts.playSilentUtterance(SMALL_GAP, TextToSpeech.QUEUE_ADD, "gap" + System.nanoTime());
                  }
                  tts.playSilentUtterance(ORDER_GAP - SMALL_GAP, TextToSpeech.QUEUE_ADD, "end" + System.nanoTime());
              }

              private void speak(String text) {
                  if (!ttsReady || text == null) return;
                  tts.speak(text, TextToSpeech.QUEUE_ADD, null, "hz" + System.nanoTime());
              }

              private PendingIntent openApp() {
                  Intent i = new Intent(this, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                  return PendingIntent.getActivity(this, 0, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              }

              private void notifyOrder(JSONObject o) {
                  try {
                      boolean table = "table".equals(str(o, "source"));
                      String no = str(o, "order_no");
                      String name = str(o, "customer_name");
                      String title = table ? "🔔 " + locLabel(o) + " – new order #" + no
                              : "🛵 Online order #" + no + (name.isEmpty() ? "" : " – " + name);
                      StringBuilder body = new StringBuilder();
                      JSONArray arr = o.optJSONArray("items");
                      if (arr != null) for (int i = 0; i < arr.length(); i++) {
                          JSONObject it = arr.optJSONObject(i);
                          if (it == null) continue;
                          if (body.length() > 0) body.append(", ");
                          String l = str(it, "l");
                          body.append(it.optInt("q", 1)).append("× ").append(str(it, "n")).append(l.isEmpty() ? "" : " (" + l + ")");
                      }
                      Notification n = new Notification.Builder(this, CH_ORD)
                              .setSmallIcon(R.drawable.ic_stat)
                              .setContentTitle(title)
                              .setContentText(body.toString())
                              .setStyle(new Notification.BigTextStyle().bigText(body.toString()))
                              .setContentIntent(openApp())
                              .setCategory(Notification.CATEGORY_MESSAGE)
                              .setOnlyAlertOnce(false)
                              .setAutoCancel(false)
                              .build();
                      nm.notify(o.getString("id").hashCode(), n);
                  } catch (Exception e) { /* ignore */ }
              }

              private Notification serviceNotification(String text) {
                  Intent stop = new Intent(this, OrderService.class).setAction("STOP");
                  PendingIntent sp2 = PendingIntent.getService(this, 1, stop, PendingIntent.FLAG_IMMUTABLE);
                  Notification.Action act = new Notification.Action.Builder(
                          Icon.createWithResource(this, R.drawable.ic_stat), "Stop", sp2).build();
                  return new Notification.Builder(this, CH_SVC)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle("Haywizz Kitchen")
                          .setContentText(text)
                          .setContentIntent(openApp())
                          .setOngoing(true)
                          .addAction(act)
                          .build();
              }

              private void setStatus(String s) {
                  if (s.equals(lastStatus)) return;
                  lastStatus = s;
                  nm.notify(SVC_ID, serviceNotification(s));
              }
          }
