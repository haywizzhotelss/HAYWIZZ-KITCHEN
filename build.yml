          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.haywizz.kitchen'
              compileSdk 34

              defaultConfig {
                  applicationId "com.haywizz.kitchen"
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              signingConfigs {
                  debug {   // fixed key: every new build installs over the old app (no uninstall needed)
                      storeFile file('haywizz.jks')
                      storePassword 'haywizz123'
                      keyAlias 'haywizz'
                      keyPassword 'haywizz123'
                  }
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
